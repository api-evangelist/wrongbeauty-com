    All three hard checks pass: capabilities is an OBJECT, protocolVersion is present ("0.3.0") and skills is
    an ARRAY of three. preferredTransport is absent, which under the pipeline's grading holds the card at
    near-conformant rather than conformant (A2A 0.3.0 defaults an absent preferredTransport to JSONRPC, but
    no JSON-RPC responder exists at the card's url, so the default cannot be exercised). The card is a
    well-formed A2A discovery document describing a REST-only agent surface.
  deviations:
  - field: preferredTransport
    observed: absent
    note: Optional in 0.3.0 (defaults to JSONRPC). Recorded because the default names a transport the host does not serve.
  - field: url
    observed: https://swarm-api.wrongbeauty.com
    note: >-
      The A2A url is meant to be the endpoint a client sends JSON-RPC to. POST to it returns 404 "Cannot POST /".
      The only path that accepts a POST without a documented schema, /a2a, is undeclared and returns a fixed
      non-JSON-RPC reply. An A2A client cannot invoke any of the three skills through this card; it must read
      documentationUrl and call REST.
  - field: endpoints
    observed: '[{type: rest, url: https://swarm-api.wrongbeauty.com}]'
    note: Not an A2A field. The 0.3.0 field for extra transports is additionalInterfaces[] {url, transport}.
  - field: capabilities
    observed: 'push (not pushNotifications) plus non-standard keys cultural_participation, supported_roles, provenance_receipts, ruleset_version'
    note: The standard keys are streaming, pushNotifications, stateTransitionHistory and extensions[]; the extra keys are domain vocabulary carried inside the capabilities object.
  - field: authentication
    observed: '{type: none, description: ...}'
    note: Not an A2A 0.3.0 field (that revision uses securitySchemes + security). The intent — no credential for public read, none for a first submission — matches the protocol page.
  - field: provider.name
    observed: WRONG BEAUTY
