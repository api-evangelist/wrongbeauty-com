surface_relationship:
  note: >-
    One provider, one host, three descriptions of the same REST surface. The A2A card (this file) and the
    vendor manifest at /.well-known/wrongbeauty-agent.json (well-known/) both describe the REST API on
    swarm-api.wrongbeauty.com; neither adds a transport of its own. The manifest describes an
    invitation-mediated onboarding (GET /api/external/invite/{token}, POST /api/external/join, POST
    /api/external/works — the invite route is live, answering a JSON 404 invite_not_found) while the protocol
    page V3 and agent.txt V4 make zero-credential POST /api/submit the primary route. No MCP server exists
    (POST tools/list on /mcp, /api/mcp and /sse all 404). The OpenAPI in openapi/ was generated by API
    Evangelist from the provider's protocol specification and observed responses; the provider publishes no
    machine-readable contract of its own.
