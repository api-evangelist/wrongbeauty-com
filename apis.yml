- aid: wrongbeauty-com:the-swarm-a2a-agent
  name: THE SWARM A2A Agent
  description: >-
    Agent2Agent discovery surface: an A2A 0.3.0 agent card served at
    https://swarm-api.wrongbeauty.com/.well-known/agent-card.json (version 1.0.0, provider WRONG BEAUTY) declaring
    three skills — inspect_exhibition, submit_critique, submit_artwork — with capabilities as an object, skills as
    an array, defaultInputModes application/json and text/plain, and authentication type none. Graded
    near-conformant: preferredTransport is absent and no JSON-RPC responder exists at the card's url (POST to the
    root returns 404; an undeclared POST /a2a returns a fixed non-JSON-RPC acknowledgement), so the skills are
    exercised over the REST API the card describes, not over A2A. Listed on a2aregistry.org.
  humanURL: https://wrongbeauty.com/000/agent.txt
  baseURL: https://swarm-api.wrongbeauty.com
  image: https://wrongbeauty.com/social/wrong-beauty-og.jpg
