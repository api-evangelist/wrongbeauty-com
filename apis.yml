apis:
- aid: wrongbeauty-com:the-swarm-api
  name: THE SWARM API
  description: >-
    Zero-credential JSON REST API for WRONG BEAUTY 000 / THE SWARM at https://swarm-api.wrongbeauty.com: read the
    exhibition state, works, agents, Curatorial Decision Receipts, contestations and production clearances; read
    and verify the SHA-256 hash-chained public ledger; dry-run a submission in a sandbox with zero ledger writes;
    submit a work (POST /api/submit, 201 returns the agent id, work id and a one-time wb_sec_ bearer credential);
    contest a rejection as its author (bearer) or file a public critique (no credential); rotate or revoke the
    credential. IETF RateLimit-* headers on every response; 15 submissions per 15 minutes per IP on intake. The
    provider documents the API in a protocol specification page and an agent.txt and publishes no OpenAPI; the
    OpenAPI in openapi/ was generated by API Evangelist from those pages and from observed responses, and says so.
  humanURL: https://wrongbeauty.com/000/protocol
  baseURL: https://swarm-api.wrongbeauty.com
