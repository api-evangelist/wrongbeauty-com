summary: >-
  THE SWARM's conformance profile is an agent-discovery layer over a plain JSON REST API: an A2A 0.3.0 agent
  card (near-conformant; no JSON-RPC transport behind it), IETF HTTP API rate-limit header fields on every
  response, HSTS and a strict Content-Security-Policy on the API host, and a self-described SHA-256
  predecessor hash chain over an append-only ledger with an explicit disclosure that it is NOT externally
  anchored. It declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API
  catalog, no APIs.json, no llms.txt, no Idempotency-Key and no RFC 8594 sunset signalling. The art /
  exhibition market has no machine-readable domain standard this pipeline recognises, so no
  domain_standard_conformance is claimed.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  grade: near-conformant
  evidence: a2a/wrongbeauty-com-agent-card.json — protocolVersion "0.3.0", capabilities object, skills[] of 3, defaultInputModes/defaultOutputModes present, preferredTransport absent; POST to the card url returns 404 and no JSON-RPC responder exists (see a2a/wrongbeauty-com-a2a.yml).
  note: A conformant-shaped discovery document for a REST-only surface; the card cannot be used to invoke a skill over A2A.
- id: ietf-ratelimit-headers
  name: RateLimit header fields for HTTP (draft-ietf-httpapi-ratelimit-headers)
  conforms: true
  evidence: 'Observed on every live response 2026-09-19: ratelimit-policy: 300;w=60, ratelimit-limit: 300, ratelimit-remaining: 299, ratelimit-reset: 60 (GET https://swarm-api.wrongbeauty.com/api/events). Not mentioned in any documentation.'
- id: hsts
  name: HTTP Strict Transport Security (RFC 6797)
  conforms: true
  evidence: 'strict-transport-security: max-age=31536000; includeSubDomains on swarm-api.wrongbeauty.com responses. The apex wrongbeauty.com sends no HSTS header (security/wrongbeauty-com-domain-security.yml).'
- id: csp
  name: Content Security Policy
  conforms: true
  evidence: "content-security-policy: default-src 'self'; ... object-src 'none'; script-src 'self'; upgrade-insecure-requests plus X-Content-Type-Options nosniff, Referrer-Policy no-referrer, COOP/CORP same-origin on the API host — the Helmet default header set."
- id: sha256-hash-chained-ledger
  name: Provider-defined append-only hash chain (self-described, not an external standard)
  conforms: true
  evidence: 'GET /api/verify returns chain_valid true, hash_algorithm SHA-256, 20/20 events verified, genesis and head hashes; protocol page section 7 publishes the formula event_hash = sha256(id + type + prev_hash + actor_id + work_id + payload + timestamp).'
  disclosure: '"External anchoring: not implemented. ... It is not anchored into an external public blockchain, witness network, or distributed timestamping authority. We do not claim external permanence or decentralized consensus." (https://wrongbeauty.com/000/verify)'
  note: Recorded because the provider publishes the algorithm and a live verifier; it is not an IETF/ISO/W3C standard and earns no domain-standard credit.
- id: json-rpc-2.0
  conforms: false
  evidence: 'POST https://swarm-api.wrongbeauty.com/a2a with a JSON-RPC 2.0 tasks/get request returned a non-JSON-RPC body {"role":"assistant","content":...,"status":"completed","agent":"WB000-A0003"}; POST to the card url / returned 404.'
- id: mcp
  conforms: false
  evidence: POST tools/list on /mcp, /api/mcp and /sse of the API host all returned the Express 404; no MCP server is documented.
- id: oauth2
  conforms: false
  evidence: 'No OAuth flow; the API mints its own bearer credential (wb_sec_...) on first submission. /.well-known/oauth-authorization-server 404 on all three hosts.'
